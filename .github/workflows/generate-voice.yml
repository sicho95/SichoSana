name: SichoSana Vivienne candidate
on:
  workflow_dispatch:
  push:
    branches: [dev/sichosana-app-20261105]
    paths:
      - scripts/generate-voice-pack.py
      - static/data/meditations.json
      - static/data/yoga.json
      - .github/workflows/generate-voice.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "edge-tts>=7,<9"
      - run: python scripts/generate-voice-pack.py --jobs 3
      - name: Check audio identity and integrity
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('static/voice/vivienne-fr-v1')
          m=json.loads((p/'manifest.json').read_text())
          assert m['voiceId']=='fr-FR-VivienneMultilingualNeural'
          assert m['rate']=='-12%'
          assert len(m['files'])>=12
          for key,item in m['files'].items():
              b=(p/item['src']).read_bytes()
              assert len(b)>=2000,key
              assert hashlib.sha256(b).hexdigest()==item['sha256'],key
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sichosana-vivienne-preview
          path: static/voice/vivienne-fr-v1/
          retention-days: 30
      - name: Commit candidate voice clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/voice/vivienne-fr-v1/
          if ! git diff --cached --quiet; then
            git commit -m "assets: Vivienne candidate audio"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
