name: SichoSana quality checks
on:
  push:
    branches: [dev/sichosana-20261105, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/sw.js
      - name: Check Python syntax
        run: python -m compileall -q server scripts
      - name: API and SQLite tests
        run: python -m unittest discover -s tests -v
      - name: Validate catalogs
        run: |
          python - <<'PY'
          import json
          p=json.load(open("static/data/yoga.json"))
          m=json.load(open("static/data/meditations.json"))
          pose={x["id"] for x in p["poses"]}
          assert all(set(r["poseIds"]) <= pose for r in p["routines"])
          for s in m["sessions"]:
            assert all(s["scripts"][k] for k in ("discrete","equilibree","enveloppante"))
          print(len(p["poses"]),"poses /",len(p["routines"]),"routines /",len(m["sessions"]),"meditations")
          PY
      - name: Validate Compose
        run: docker compose -f compose.yaml config -q
