name: SichoSana quality checks
on:
  push:
    branches: [dev/sichosana-20261105, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/sw.js
      - name: Check deployment shell syntax
        run: |
          sh -n scripts/upgrade-v2.1-qnap.sh
          sh -n scripts/upgrade-v2.2-qnap.sh
          sh -n scripts/upgrade-v2.2-no-git-qnap.sh
          sh -n scripts/upgrade-v2.3-qnap.sh
          sh -n scripts/upgrade-v2.3-no-git-qnap.sh
          sh -n scripts/install-original-art-qnap.sh
          sh -n scripts/configure-smtp-gmail-qnap.sh
      - name: Check Python syntax
        run: python -m compileall -q server scripts
      - name: API and SQLite tests
        run: python -m unittest discover -s tests -v
      - name: Validate catalogs
        run: |
          python - <<'PY'
          import json
          p=json.load(open("static/data/yoga.json"))
          m=json.load(open("static/data/meditations.json"))
          salutations=json.load(open("static/data/salutations.json"))
          assert len(salutations["routines"])==2
          valid={p["id"] for p in json.load(open("static/data/yoga.json"))["poses"]}
          valid.update(p["id"] for p in salutations["extraPoses"])
          valid.update(p["id"] for p in json.load(open("static/data/yoga-api-library.json"))["poses"])
          for salute in salutations["routines"]:
              assert len(salute["steps"])>=10
              assert set(salute["fullPrerequisites"]+salute["easyPrerequisites"]) <= valid
              assert all(step["poseId"] in valid and step.get("easyPoseId",step["poseId"]) in valid for step in salute["steps"])
          pose={x["id"] for x in p["poses"]}
          assert all(set(r["poseIds"]) <= pose for r in p["routines"])
          for s in m["sessions"]:
            assert all(s["scripts"][k] for k in ("discrete","equilibree","enveloppante"))
          pg=json.load(open("static/data/programs.json"))
          routine_ids={r["id"] for r in p["routines"]}
          routine_ids.update(r["id"] for r in json.load(open("static/data/salutations.json"))["routines"])
          med_ids={s["id"] for s in m["sessions"]}
          for program in pg["programs"]:
            assert len(program["steps"])>=5
            assert all((s["ref"] in routine_ids if s["type"]=="yoga" else s["ref"] in med_ids) for s in program["steps"])
          print(len(p["poses"]),"poses /",len(p["routines"]),"routines /",len(m["sessions"]),"meditations /",len(pg["programs"]),"programmes")
          PY
      - name: Verify 58 canonical PNGs for 73 pose references, salutations and 183 audio clips
        run: python scripts/verify-v23-art-and-salutations.py --root .
      - name: Validate Compose
        run: docker compose -f compose.yaml config -q
