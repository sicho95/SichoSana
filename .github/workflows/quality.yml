name: SichoSana quality checks
on:
  push:
    branches: [dev/sichosana-app-20261105]
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r server/requirements.txt pytest httpx
      - run: python -m pytest -q server/tests
      - run: node --check static/app.js && node --check static/sw.js
      - run: python -m json.tool static/data/yoga.json >/dev/null && python -m json.tool static/data/meditations.json >/dev/null
      - run: python -m py_compile scripts/generate-voice-pack.py server/app.py
