name: sichosana
services:
  sichosana:
    build:
      context: .
      dockerfile: Dockerfile
    image: sichosana:local
    container_name: sichosana-app
    restart: unless-stopped
    init: true
    environment:
      SICHOSANA_WEB_ROOT: /app/static
      SICHOSANA_DATA_DIR: /data
      SICHOSANA_PORT: "8080"
    ports:
      - "${SICHOSANA_BIND:-127.0.0.1}:${SICHOSANA_PORT:-18887}:8080"
    volumes:
      - ./runtime:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
    healthcheck:
      test: ["CMD","python","-c","from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8080/api/health',timeout=3).status==200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
