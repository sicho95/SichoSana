services:
  sichosana:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: sichosana
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SICHOSANA_DB_PATH: /data/sichosana.sqlite3
      SICHOSANA_REGISTRATION_ENABLED: ${SICHOSANA_REGISTRATION_ENABLED:-0}
      SICHOSANA_VAPID_PUBLIC_KEY: ${SICHOSANA_VAPID_PUBLIC_KEY:-}
      SICHOSANA_VAPID_PRIVATE_KEY: ${SICHOSANA_VAPID_PRIVATE_KEY:-}
      SICHOSANA_VAPID_EMAIL: ${SICHOSANA_VAPID_EMAIL:-}
    ports:
      - "127.0.0.1:18765:8765"
    volumes:
      - sichosana-data:/data
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  sichosana-data:
    name: sichosana-data
